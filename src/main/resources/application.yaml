spring:
  application:
    name: ai-classifier-service
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
    model:
      embedding: none
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "*"